<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRTC Audio/Video Demo · Quectel Pi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot" id="sigDot"></span>
    <strong data-i18n="brand.title">WebRTC 音视频演示</strong>
    <span class="sub" id="sigText" data-i18n="sig.offline">未连接信令</span>
  </div>
  <div class="joinrow">
    <label><span data-i18n="form.room">房间</span> <input id="roomInput" value="demo" size="8" autocomplete="off"></label>
    <label><span data-i18n="form.name">本端名称</span> <input id="nameInput" value="" size="10" autocomplete="off" placeholder="板子 / PC" data-i18n-ph="form.namePh"></label>
    <button id="joinBtn" class="primary" data-i18n="form.join">加入房间</button>
    <button id="leaveBtn" class="ghost" data-i18n="form.leave" disabled>离开</button>
    <button id="langBtn" class="ghost lang" data-i18n="lang.switch" data-i18n-label="lang.name">EN</button>
  </div>
  <div id="phoneBanner" class="banner hidden"></div>
</header>

<main>
  <section class="stage">
    <div id="grid" class="grid"></div>
    <div id="hint" class="hint">
      <h3 data-i18n="hint.title">开始</h3>
      <ol>
        <li data-i18n="hint.s1">点「加入房间」，允许摄像头和麦克风。</li>
        <li data-i18n="hint.s2">另一台设备打开同一地址，用相同房间名加入。</li>
        <li data-i18n="hint.s3">连上后右侧可看码率、分辨率、丢包、RTT。</li>
      </ol>
      <p class="muted" data-i18n="hint.limit">一个房间最多 4 路。</p>
    </div>
    <button id="soundBtn" class="sound hidden" data-i18n="sound.enable">🔊 点一下开启对方声音</button>
  </section>

  <aside class="panel">
    <div class="ctl">
      <button id="micBtn" class="toggle on" data-i18n="ctl.mic" disabled>🎤 麦克风</button>
      <button id="camBtn" class="toggle on" data-i18n="ctl.cam" disabled>📷 摄像头</button>
    </div>

    <div class="field">
      <label for="camSel" data-i18n="field.camera">摄像头</label>
      <select id="camSel" disabled></select>
    </div>
    <div class="field">
      <label for="micSel" data-i18n="field.mic">麦克风</label>
      <select id="micSel" disabled></select>
    </div>
    <div class="field">
      <label for="rateSel" data-i18n="field.rate">视频码率上限</label>
      <select id="rateSel" disabled>
        <option value="800" data-i18n="rate.800">800 kbps（弱网 / 720p30 够用）</option>
        <option value="1500" data-i18n="rate.1500" selected>1.5 Mbps（默认 / 720p30）</option>
        <option value="3000" data-i18n="rate.3000">3 Mbps（1080p30）</option>
        <option value="0" data-i18n="rate.none">不限制</option>
      </select>
    </div>
    <div class="field">
      <label for="stunInput" data-i18n="field.stun">ICE 服务器（可选，逗号分隔）</label>
      <input id="stunInput" placeholder="stun:stun.l.google.com:19302" autocomplete="off">
    </div>

    <h4 data-i18n="stats.title">实时统计</h4>
    <div id="stats" class="stats"><p class="muted" data-i18n="stats.empty">加入房间后显示</p></div>

    <h4 data-i18n="log.title">日志</h4>
    <pre id="log" class="log"></pre>
  </aside>
</main>

<audio id="remoteAudioSink" autoplay playsinline style="display:none"></audio>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
